<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landmark Icon Options</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f5f5f5;
        color: #111111;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        max-width: 760px;
        gap: 24px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .item {
        display: grid;
        justify-items: center;
        gap: 12px;
        border: 1px solid #dedede;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px 12px 16px;
      }

      .name {
        color: #6f6f6f;
        font-size: 12px;
        font-weight: 700;
      }

      .icon {
        display: grid;
        place-items: center;
        border-radius: 999px;
      }

      .outline {
        width: 28px;
        height: 28px;
        border: 1.5px solid #111111;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 4px 10px rgba(17, 17, 17, 0.14);
      }

      .soft-outline {
        width: 28px;
        height: 28px;
        border: 1px solid #c7c7c7;
        background: #ffffff;
        color: #333333;
        box-shadow: 0 3px 8px rgba(17, 17, 17, 0.12);
      }

      .dot {
        width: 24px;
        height: 24px;
        border: 1.5px solid #ffffff;
        background: #111111;
        color: #ffffff;
        box-shadow: 0 4px 10px rgba(17, 17, 17, 0.18);
      }

      .pin {
        width: 28px;
        height: 28px;
        transform: rotate(45deg);
        border: 1.5px solid #111111;
        border-radius: 50% 50% 50% 6px;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 4px 10px rgba(17, 17, 17, 0.14);
      }

      .pin svg {
        transform: rotate(-45deg);
      }

      .ghost {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(17, 17, 17, 0.3);
        background: rgba(255, 255, 255, 0.82);
        color: #111111;
      }

      .current {
        width: 36px;
        height: 36px;
        border: 3px solid #ffffff;
        background: #0f766e;
        color: #ffffff;
      }

      .tower-line {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      @media (max-width: 640px) {
        body {
          padding: 20px;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Landmark Icon Options</h1>

      <section class="grid">
        <div class="item">
          <div class="icon outline">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">01 Outline</div>
        </div>

        <div class="item">
          <div class="icon soft-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">02 Soft</div>
        </div>

        <div class="item">
          <div class="icon dot">
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">03 Black Dot</div>
        </div>

        <div class="item">
          <div class="icon pin">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">04 Pin</div>
        </div>

        <div class="item">
          <div class="icon ghost">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">05 Ghost</div>
        </div>

        <div class="item">
          <div class="icon current">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tower-line" d="M12 3v3M10.8 6h2.4l-.4 3h-1.6l-.4-3ZM10 9h4l-.5 3h-3L10 9ZM8.5 12h7v3h-7v-3ZM10.5 15h3l.4 5h-3.8l.4-5ZM8 20h8" />
            </svg>
          </div>
          <div class="name">Current</div>
        </div>
      </section>
    </main>
  </body>
</html>
